name: zizmor

# Security audit of the CI config itself: the workflows and dependabot.yml.
# Runs the zizmor hook from .pre-commit-config.yaml, so the zizmor version is
# pinned in one place and Dependabot bumps it.
on:
  pull_request:
    paths:
      - '.github/**'
      - '.pre-commit-config.yaml'
  push:
    branches:
      - main
    paths:
      - '.github/**'
      - '.pre-commit-config.yaml'

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
