name: zizmor

# Security audit of the CI config itself: the workflows and dependabot.yml.
# Offline, so it needs no API token and its result depends only on the repo.
on:
  pull_request:
    paths:
      - '.github/**'
  push:
    branches:
      - main
    paths:
      - '.github/**'

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: '1.32.0'
          online-audits: false
          advanced-security: false
          annotations: true
